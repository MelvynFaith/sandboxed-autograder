# SPDX-License-Identifier: MIT
#
# Nginx site of the auto-grading platform (SRS Bagian 13.2 step 6). Install steps: infra/README.md,
# "Nginx". The dashboard and the backend share one origin, so the dashboard's relative /api/v1 and
# /ws/v1 URLs need no CORS:
#
#   /          the frontend build in /var/www/autograder; a path that is not a file gets
#              index.html, and the dashboard's router resolves it
#   /api/      the REST API, on the backend at 127.0.0.1:8080 (autograder.service)
#   /healthz   aggregate health (NFR-09), so a monitor outside the server can poll it
#   /ws/       the WebSocket status channel, with the upgrade headers passed on
#
# Plain HTTP on port 80 for now: there is no DNS name, so there can be no certificate, and until
# there is one, passwords and tokens cross the network unencrypted (SRS Bagian 2.4). The lines
# marked "TLS" switch the site to HTTPS; the steps are in infra/README.md, "HTTPS". If the server
# cannot be reached from outside the campus, risk R10 lists the fallbacks: (a) ask the campus
# network administrators to open the ports, (b) a public tunnel such as Cloudflare Tunnel in front
# of this site, (c) a free-tier cloud VM installed from the same steps.

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	# TLS: replace the two listen lines and server_name above with these, NAME being the DNS name.
	# listen 443 ssl default_server;
	# listen [::]:443 ssl default_server;
	# server_name NAME;
	# ssl_certificate /etc/letsencrypt/live/NAME/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/NAME/privkey.pem;
	# ssl_protocols TLSv1.2 TLSv1.3;
	# add_header Strict-Transport-Security "max-age=31536000" always;

	server_tokens off;
	root /var/www/autograder;

	# The backend refuses JSON bodies over 1 MiB itself, with the API's error format (maxRequestBytes
	# in scheduler/internal/api); this stops anything larger before Nginx buffers it.
	client_max_body_size 1m;

	# Every location below inherits these, because none sets a header of its own: an add_header in a
	# location would drop all of them there. The build loads its script and style sheet from /assets
	# and connects only to this origin, which 'self' covers, ws:// and wss:// included.
	add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;
	add_header Referrer-Policy same-origin always;

	location / {
		try_files $uri /index.html;
	}

	# index.html names the hashed bundles of the current build, so browsers revalidate it on every
	# load, and a new build shows up without a hard refresh.
	location = /index.html {
		expires -1;
	}

	# Vite puts a content hash in every file name here, so a file never changes once published. A
	# missing one is a 404, not index.html, which a browser would refuse to run as a script.
	location /assets/ {
		try_files $uri =404;
		expires 1y;
		gzip on;
		gzip_vary on;
		gzip_types text/css application/javascript text/javascript;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:8080;
	}

	# Uploads: one .py file of at most 256 KiB (FR-04) in a multipart body. 260k leaves 4 KiB for
	# the boundaries, the part headers and assignment_id; a larger body gets 413 from Nginx before
	# it is buffered.
	location = /api/v1/submissions {
		client_max_body_size 260k;
		proxy_pass http://127.0.0.1:8080;
	}

	location = /healthz {
		proxy_pass http://127.0.0.1:8080;
	}

	# Upgrade and Connection are hop-by-hop headers, which Nginx drops unless they are set again
	# here. The backend pings every 54 seconds (scheduler/internal/stream), so the read timeout
	# only closes a connection whose backend has gone silent.
	location /ws/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection upgrade;
		proxy_read_timeout 10m;
	}

	# Let's Encrypt HTTP-01 challenges, for certbot --webroot (infra/README.md, "HTTPS").
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
	}
}

