name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each component job runs only once that component's manifest exists, so CI
  # stays green while the monorepo is filled in module by module.
  detect:
    name: Detect components
    runs-on: ubuntu-24.04
    outputs:
      sandbox: ${{ steps.detect.outputs.sandbox }}
      scheduler: ${{ steps.detect.outputs.scheduler }}
      grader: ${{ steps.detect.outputs.grader }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          has() { if [ -e "$1" ]; then echo true; else echo false; fi; }
          {
            echo "sandbox=$(has sandbox/Makefile)"
            echo "scheduler=$(has scheduler/go.mod)"
            echo "grader=$(has grader/pyproject.toml)"
            echo "frontend=$(has frontend/package-lock.json)"
          } | tee -a "$GITHUB_OUTPUT"

  sandbox:
    name: sandbox (C)
    needs: detect
    if: needs.detect.outputs.sandbox == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libseccomp-dev
      # The Makefile owns the compiler flags; it must build with -Wall -Wextra -Werror (NFR-07).
      - name: Build
        run: make
      # The adversarial suite (SRS 11.3, NFR-07) runs on the three builds that matter: the normal
      # one, the ptrace fallback for kernels without seccomp user notification (SRS risk R12), and
      # AddressSanitizer + UBSan. It builds on the real thing, not a mock: user namespaces, cgroup
      # v2 and seccomp of the runner's own kernel.
      - name: Build the ptrace-fallback and sanitizer variants
        run: |
          make CFLAGS=-DSBX_FORCE_TRACE BUILD_DIR=build/trace BIN=sandbox-exec-trace
          make SANITIZE=1 BUILD_DIR=build/asan BIN=sandbox-exec-asan
      # GitHub-hosted Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor
      # (SRS risk R9). The runner is a throwaway VM, so switch the restriction off for the job.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # A transient system service with Delegate=yes gives the unprivileged user a cgroup subtree to
      # write limits in, which is how the production unit works (infra/README.md). stdin is closed
      # because some tests let sandbox-exec read the caller's.
      - name: Adversarial suite
        run: sudo systemd-run --wait --pipe --collect -p User="$USER" -p Delegate=yes "$PWD/tests/run.sh" "$PWD/sandbox-exec" < /dev/null
      - name: Adversarial suite, ptrace fallback
        run: sudo systemd-run --wait --pipe --collect -p User="$USER" -p Delegate=yes "$PWD/tests/run.sh" "$PWD/sandbox-exec-trace" < /dev/null
      - name: Adversarial suite, AddressSanitizer and UBSan
        run: sudo systemd-run --wait --pipe --collect -p User="$USER" -p Delegate=yes "$PWD/tests/run.sh" "$PWD/sandbox-exec-asan" < /dev/null

  scheduler:
    name: scheduler (Go)
    needs: detect
    if: needs.detect.outputs.scheduler == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scheduler
    # PostgreSQL 16 is what Ubuntu 24.04, the deployment target, packages. The password belongs to
    # a container that lives for this job only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOGRADER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: scheduler/go.mod
          cache-dependency-path: scheduler/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...

  grader:
    name: grader (Python)
    needs: detect
    if: needs.detect.outputs.grader == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: grader
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: grader/pyproject.toml
      - name: Install
        run: python -m pip install -e . ruff pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  frontend:
    name: frontend (React)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build
