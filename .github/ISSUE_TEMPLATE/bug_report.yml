name: Bug report
description: Something behaves differently from what it should. For security vulnerabilities, use private reporting (see SECURITY.md).
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - sandbox
        - scheduler
        - grader
        - frontend
        - infra
        - unsure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a student
        2. Submit the attached solution to assignment X
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or version, deployment (local, staging, or production), browser if it is a UI bug, and kernel version for sandbox bugs (`uname -r`).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste only the relevant lines. Remove tokens, passwords, and student data first.
      render: text
