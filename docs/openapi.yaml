      type: object
      required: [status, current_test, total_tests]
      properties:
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED]
        current_test:
          type: integer
          minimum: 0
          description: 1-based current test, or zero before testing begins.
        total_tests:
          type: integer
          minimum: 0
          description: Total test cases in the grading run.
    WebSocketTicketRequest:
      type: object
      additionalProperties: false
      required: [submission_id]
      properties:
        submission_id:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: string
              pattern: '^[1-9][0-9]*$'
          description: Positive submission ID; the handler accepts an integer or decimal string.
    TestCaseDocument:
      type: object
      additionalProperties: false
      required: [schema_version]
      properties:
        schema_version:
          type: integer
          const: 1
        assignment:
          type: string
          description: Included on export; import does not use this field to select the target assignment.
        resource_limit:
          $ref: '#/components/schemas/YAMLResourceLimit'
        test_cases:
          type: array
          items:
            $ref: '#/components/schemas/YAMLTestCase'
      description: UTF-8 YAML document; the API accepts one document up to 1 MiB.
    TestCaseExportDocument:
      allOf:
        - $ref: '#/components/schemas/TestCaseDocument'
        - type: object
          required: [schema_version, assignment, resource_limit, test_cases]
          properties:
            test_cases:
              type: array
              items:
                $ref: '#/components/schemas/YAMLTestCaseExport'
    YAMLResourceLimit:
      type: object
      additionalProperties: false
      required: [cpu_time_ms, memory_mb, tmpfs_size_mb, max_processes, timeout_s, max_output_bytes]
      properties:
        cpu_time_ms:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        tmpfs_size_mb:
          type: integer
          minimum: 1
        max_processes:
          type: integer
          minimum: 1
        timeout_s:
          type: integer
          minimum: 1
        max_output_bytes:
          type: integer
          minimum: 1
      description: The resource-limit validation also enforces the memory/tmpfs/output invariants.
    YAMLTestCase:
      type: object
      additionalProperties: false
      required: [external_id, weight, match_mode]
      properties:
        external_id:
          type: string
          minLength: 1
        input:
          type: string
        expected_output:
          type: string
        weight:
          type: integer
          minimum: 1
        is_hidden:
          type: boolean
        match_mode:
          type: string
          enum: [EXACT, WHITESPACE_INSENSITIVE]
      description: Input and expected_output must not contain a NUL character.
    YAMLTestCaseExport:
      allOf:
        - $ref: '#/components/schemas/YAMLTestCase'
        - type: object
          required: [external_id, input, expected_output, weight, is_hidden, match_mode]
