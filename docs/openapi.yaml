          type: integer
          minimum: 0
          maximum: 86400
        max_submissions_per_assignment:
          type: integer
          minimum: 0
          maximum: 10000
    RateLimitsRequest:
      type: object
      additionalProperties: false
      required: [max_active_submissions, min_submission_interval_s, max_submissions_per_assignment]
      properties:
        max_active_submissions:
          type: integer
          minimum: 0
          maximum: 10000
        min_submission_interval_s:
          type: integer
          minimum: 0
          maximum: 86400
        max_submissions_per_assignment:
          type: integer
          minimum: 0
          maximum: 10000
      description: Zero disables the corresponding rate-limit rule.
