openapi: 3.1.0
info:
  title: Sandboxed Autograder API
  version: 1.0.0
  description: |
    Contract for all 45 explicitly registered HTTP method/path patterns in the scheduler. This
    includes `/healthz` and the ticket-authenticated WebSocket handshake at
    `/ws/v1/submissions/{id}`. Go's `GET` patterns also match `HEAD`; HEAD is an implicit
    net/http behavior, not a separate router registration. The WebSocket sends JSON progress state
    frames and is described on its operation; obtain its one-time query ticket from
    `POST /api/v1/ws-tickets`. The private SRS is not in this repository, so comparison with SRS
    6.3.1 is not verified. Request details not specified by available requirements are identified
    as implementation contracts rather than inferred.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Registration, login, refresh, and logout.
  - name: Users
    description: The authenticated user's profile and password.
  - name: Admin users
    description: Administrator-only user listing and role changes.
  - name: Courses
    description: Visible Course listing and Course creation.
  - name: Enrollments
    description: Enrollment management by the Course owner or an administrator.
  - name: Submissions
    description: Submission upload, history, details, code, reports, cancellation, and regrading.
  - name: Assignments
    description: Assignment access and management, resource limits, and assignment-wide regrading.
  - name: Test cases
    description: Test-case CRUD and schema-versioned YAML import/export.
  - name: Results
    description: Instructor/admin grade recaps and CSV export.
  - name: Administration
    description: Admin audit, queue, and submission rate-limit operations.
  - name: WebSocket
    description: One-time-ticket authenticated submission progress stream.
  - name: Health
    description: Unauthenticated aggregate process, database, worker, and queue health.
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a student account
      description: |
        Registration always creates a STUDENT. The `name`, `email`, and `password` request fields
        are the implemented contract; the SRS does not define this request body. Unknown fields
        are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                email:
                  type: string
                  description: Server-validated and normalized to lowercase; maximum 254 UTF-8 bytes.
                password:
                  type: string
                  minLength: 1
                  description: Maximum 1024 UTF-8 bytes.
      responses:
        '201':
          description: Student account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in and issue a token pair
      description: Invalid credentials return the same 401 response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Trimmed and normalized to lowercase before lookup.
                password:
                  type: string
                  minLength: 1
                  description: Maximum 1024 UTF-8 bytes; invalid or oversized credentials return 401.
      responses:
        '200':
          description: Access and refresh tokens with the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshTokens
      summary: Rotate a refresh token
      description: The supplied refresh token is revoked and replaced with a new token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: New access and refresh tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token is missing, invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke a refresh token
      description: |
        This endpoint does not require an access token. If `refresh_token` is provided, it is
        revoked, along with the user's other active refresh tokens. An empty, omitted, invalid, or
        expired token is a successful no-op. The request must still be a JSON object.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Token revoked, or no token was provided.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      description: Requires a valid Bearer access token.
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Update the authenticated user's display name
      description: The name is trimmed and must contain 1–200 Unicode characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Authenticated user no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me/password:
    put:
      tags: [Users]
      operationId: changeCurrentUserPassword
      summary: Change the authenticated user's password
      description: |
        The request field names are the implemented contract; the SRS does not define them.
        A successful change revokes all refresh tokens for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  minLength: 1
                new_password:
                  type: string
                  minLength: 1
                  description: Maximum 1024 UTF-8 bytes.
      responses:
        '204':
          description: Password changed; all of the user's refresh tokens were revoked.
        '400':
          description: Invalid request, invalid new password, or current password does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Authenticated user no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users:
    get:
      tags: [Admin users]
      operationId: listAdminUsers
      summary: List users as an administrator
      description: Only ADMIN may call this operation. Results are paginated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/AdminUserId'
    put:
      tags: [Admin users]
      operationId: updateUserRole
      summary: Change a user's role
      description: Only ADMIN may change a user's role; active refresh tokens are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [STUDENT, LECTURER, ADMIN]
      responses:
        '200':
          description: User with the updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Target user was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A related-data constraint prevented the role change from being committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List Courses visible to the authenticated user
      description: |
        STUDENT sees enrolled Courses, LECTURER sees owned Courses, and ADMIN sees all Courses.
        Results are paginated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of visible Courses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Create a Course
      description: |
        Only LECTURER and ADMIN may create a Course. A lecturer becomes its owner and may omit
        `lecturer_email` or provide their own email. ADMIN must provide the email of an existing
        LECTURER. These request fields are implementation-specific because FR-18 does not define
        the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, code, term]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Trimmed; the server rejects NUL and whitespace-only values.
                code:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Trimmed; the server rejects NUL and whitespace-only values.
                term:
                  type: string
                  minLength: 1
                  maxLength: 20
                  description: Trimmed; the server rejects NUL and whitespace-only values.
                lecturer_email:
                  type: string
                  description: |
                    Server-validated email address, maximum 254 UTF-8 bytes. Required for ADMIN;
                    if supplied by LECTURER, must match the caller's email.
      responses:
        '201':
          description: Course created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a LECTURER or ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The lecturer email does not identify an existing user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Course code is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /courses/{id}/assignments:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      operationId: listCourseAssignments
      summary: List assignments visible in a Course
      description: |
        Enrolled students, the current Course owner, and ADMIN may list assignments. Other users
        receive 404. Results are paginated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of Course assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAssignmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Course is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Assignments]
      operationId: createAssignment
      summary: Create an assignment in a Course
      description: Only the current Course owner or ADMIN may create assignments; other callers receive 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
      responses:
        '201':
          description: Assignment created with its required resource limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Course is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A related-data constraint prevented creation from completing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /courses/{id}/enrollments:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Enrollments]
      operationId: listCourseEnrollments
      summary: List a Course's enrollments
      description: |
        Only the current Course owner or ADMIN may list enrollments; other users receive 404.
        Results are paginated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of Course enrollments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Course is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Enrollments]
      operationId: createCourseEnrollment
      summary: Enroll a student in a Course
      description: |
        Only the current Course owner or ADMIN may add an enrollment. The email request field is
        implementation-specific because FR-18 does not define the request body. The target user
        must have the STUDENT role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  description: Trimmed, normalized to lowercase, and server-validated; maximum 254 UTF-8 bytes.
      responses:
        '204':
          description: Enrollment created.
        '400':
          description: Invalid email or target user is not a STUDENT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Course is missing/not manageable, or user email is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Student is already enrolled in the Course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /courses/{id}/enrollments/{user_id}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/EnrollmentUserId'
    delete:
      tags: [Enrollments]
      operationId: deleteCourseEnrollment
      summary: Remove a student from a Course
      description: Only the current Course owner or ADMIN may remove enrollments; other users receive 404.
      responses:
        '204':
          description: Enrollment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Course, caller's management access, or enrollment was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Upload a Python submission
      description: |
        Students may submit only to an assignment in a Course in which they are enrolled.
        The original filename is retained as metadata; the server generates the stored filename.
        A submission after deadline_at and at or before late_until_at is accepted with is_late=true.
        A request from a non-student role or for an assignment the caller cannot submit to returns
        404. Rate-limit rejections identify the violated rule in the error message.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [assignment_id, file]
              properties:
                assignment_id:
                  type: string
                  pattern: '^[1-9][0-9]*$'
                  description: Positive assignment ID.
                file:
                  type: string
                  format: binary
                  description: A .py file no larger than 256 KiB.
      responses:
        '202':
          description: Submission queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: Invalid multipart request or invalid Python filename.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment not found, inaccessible, or caller is not a student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Submission window has closed or a related submission constraint conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Upload exceeds 256 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: A submission rate limit was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Submissions]
      operationId: listSubmissions
      summary: List the authenticated user's submissions
      description: The list contains only submissions owned by the authenticated user.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: assignment_id
          in: query
          required: false
          description: Filter the caller's history to one positive assignment ID.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: A page of the caller's submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '400':
          description: Invalid pagination or assignment_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /submissions/{id}:
    parameters:
      - $ref: '#/components/parameters/SubmissionId'
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Get a visible submission
      description: |
        Available to the submission owner, an administrator, or a current lecturer who owns the
        submission's Course. Other users receive 404 to avoid disclosing whether the submission exists.
      responses:
        '200':
          description: Submission details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Submission is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Submissions]
      operationId: cancelSubmission
      summary: Cancel a queued submission
      description: |
        Only the student who owns the submission may cancel it, and only while its status is
        `QUEUED`. The submission row remains and changes to `CANCELLED`; a visible submission owned
        by another caller returns 403, while an inaccessible submission returns 404.
      responses:
        '200':
          description: The submission after cancellation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Submission is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Submission is running or is not in the QUEUED state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /submissions/{id}/report:
    parameters:
      - $ref: '#/components/parameters/SubmissionId'
    get:
      tags: [Submissions]
      operationId: getSubmissionReport
      summary: Get per-test results for a visible submission
      description: |
        Available to the submission owner, an administrator, or a current lecturer who owns the
        submission's Course. Other users receive 404. For hidden test cases, viewers other than an
        administrator or the current Course owner receive only status, score, exec_time_ms, and
        memory_kb; test identity, inputs, expected and actual output, and error message are omitted.
      responses:
        '200':
          description: Submission score and per-test results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Submission is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ws-tickets:
    post:
      tags: [WebSocket]
      operationId: createSubmissionWebSocketTicket
      summary: Issue a one-time ticket for a submission progress stream
      description: The authenticated student may request a ticket only for their own submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSocketTicketRequest'
      responses:
        '201':
          description: Single-use ticket bound to the authenticated user and submission.
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Submission does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /submissions/{id}/regrade:
    parameters:
      - $ref: '#/components/parameters/SubmissionId'
    post:
      tags: [Submissions]
      operationId: regradeSubmission
      summary: Regrade one submission
      description: |
        Only the current Course owner or ADMIN may regrade a visible submission. Its status must be
        `COMPLETED` or `FAILED`, and the retained source file must still exist. The owning student
        receives 403; callers who cannot see the submission receive 404.
      responses:
        '202':
          description: Submission queued for regrading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Submission is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Submission status does not allow regrading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: The retained source file has been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /submissions/{id}/code:
    parameters:
      - $ref: '#/components/parameters/SubmissionId'
    get:
      tags: [Submissions]
      operationId: getSubmissionCode
      summary: Read the source file of a submission
      description: |
        Available to the submission owner, the current Course owner, and ADMIN. Other callers
        receive 404. Source files removed by retention return 410.
      responses:
        '200':
          description: Stored source code and its original filename.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Submission is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: The retained source file has been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments:
    get:
      tags: [Assignments]
      operationId: listAssignments
      summary: List assignments visible to the authenticated user
      description: Students see assignments from Courses they are enrolled in; lecturers see assignments in their Courses; ADMIN can see all. Results are paginated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of visible assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments/{id}:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Assignments]
      operationId: getAssignment
      summary: Get an assignment visible to the authenticated user
      description: Students enrolled in the Course, its current lecturer, and ADMIN may view it; other users receive 404.
      responses:
        '200':
          description: Assignment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Assignments]
      operationId: updateAssignment
      summary: Update assignment details
      description: Only the current Course owner or ADMIN may update an assignment; other users receive 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentUpdateRequest'
      responses:
        '200':
          description: Updated assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Assignments]
      operationId: deleteAssignment
      summary: Delete an assignment
      description: Only the current Course owner or ADMIN may delete an assignment; other users receive 404.
      responses:
        '204':
          description: Assignment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Related data prevents deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments/{id}/regrade:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Assignments]
      operationId: regradeAssignment
      summary: Queue regrading for an assignment
      description: |
        Only the current Course owner or ADMIN may request regrading. Visible students receive 403;
        callers who cannot see the assignment receive 404. Eligible submissions with retained code
        are queued and ineligible submissions are counted as skipped.
      responses:
        '202':
          description: Counts of queued and skipped submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentRegradeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Assignment is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments/{id}/resource-limit:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Assignments]
      operationId: getAssignmentResourceLimit
      summary: Get assignment resource limits
      description: Students enrolled in the Course, its current lecturer, and ADMIN may view limits; other users receive 404.
      responses:
        '200':
          description: The assignment's resource limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLimit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Assignments]
      operationId: updateAssignmentResourceLimit
      summary: Update assignment resource limits
      description: Only the current Course owner or ADMIN may update limits; other users receive 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceLimitRequest'
      responses:
        '200':
          description: Updated resource limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLimit'
        '400':
          description: Invalid values; all six fields must be positive and satisfy the memory/tmpfs/output invariants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments/{id}/results:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Results]
      operationId: listAssignmentResults
      summary: List an assignment grade recap
      description: Only the current Course owner or ADMIN may view class results. A visible student receives 403; invisible users receive 404. Every enrolled student appears, including students without submissions.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated grade recap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResultPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Assignment is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments/{id}/results/export:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Results]
      operationId: exportAssignmentResults
      summary: Export an assignment grade recap as CSV
      description: Only the current Course owner or ADMIN may export the full class recap; visible students receive 403 and invisible users receive 404.
      responses:
        '200':
          description: RFC 4180 CSV with header `name,email,submission_id,status,total_score,max_score,is_late,stale_grade,submitted_at`; cells are protected against spreadsheet formula evaluation.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename `rekap-assignment-{id}.csv`.
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Assignment is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments/{id}/testcases:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Test cases]
      operationId: listTestCases
      summary: List test cases for an assignment
      description: |
        Students enrolled in the Course, its current lecturer, and ADMIN may list test cases.
        Hidden test cases are excluded from the list for students; only the current Course owner
        and ADMIN receive hidden cases.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated test cases visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCasePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Test cases]
      operationId: createTestCase
      summary: Create a test case
      description: Only the current Course owner or ADMIN may create test cases; other users receive 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseRequest'
      responses:
        '201':
          description: Created test case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The external ID is already used on this assignment or a related-data constraint conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments/{id}/testcases/export:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Test cases]
      operationId: exportTestCases
      summary: Export test cases and resource limits as YAML
      description: Only the current Course owner or ADMIN may export the document because it includes hidden test cases.
      responses:
        '200':
          description: Schema-version 1 YAML document.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename `testcases-assignment-{id}.yaml`.
          content:
            application/yaml:
              schema:
                $ref: '#/components/schemas/TestCaseExportDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /assignments/{id}/testcases/import:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Test cases]
      operationId: importTestCases
      summary: Import test cases and optional resource limits from YAML
      description: |
        Only the current Course owner or ADMIN may import. The entire document is validated before
        a single transaction applies the resource limits and test cases. Exactly one YAML document
        with schema_version 1 is accepted; unknown fields are rejected.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/TestCaseDocument'
      responses:
        '200':
          description: Number of created and updated test cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseImportResult'
        '400':
          description: Invalid YAML, schema version, resource limit, test case, or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Assignment is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A related-data constraint prevented the import from completing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: YAML body exceeds 1 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /testcases/{id}:
    parameters:
      - $ref: '#/components/parameters/TestCaseId'
    put:
      tags: [Test cases]
      operationId: updateTestCase
      summary: Update a test case
      description: Only the current Course owner or ADMIN may update the test case; other users receive 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseRequest'
      responses:
        '200':
          description: Updated test case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Test case is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The external ID is already used on this assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Test cases]
      operationId: deleteTestCase
      summary: Delete a test case
      description: Only the current Course owner or ADMIN may delete the test case; other users receive 404.
      responses:
        '204':
          description: Test case deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Test case is missing or not manageable by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Related data prevents deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/audit-logs:
    get:
      tags: [Administration]
      operationId: listAuditLogs
      summary: List audit events
      description: Only ADMIN may read the append-only audit log. Results are paginated newest first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/queue:
    get:
      tags: [Administration]
      operationId: getAdminQueue
      summary: Read queue, worker, and active submission counts
      description: Only ADMIN may read the aggregate queue status.
      responses:
        '200':
          description: Current in-memory queue and worker capacity plus database active counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/rate-limits:
    get:
      tags: [Administration]
      operationId: getRateLimits
      summary: Read submission rate-limit settings
      description: Only ADMIN may read these settings.
      responses:
        '200':
          description: Current configured thresholds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimits'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Administration]
      operationId: updateRateLimits
      summary: Update submission rate-limit settings
      description: |
        Only ADMIN may update these thresholds. A value of zero disables that rule. The update
        takes effect on subsequent submission requests and writes an audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitsRequest'
      responses:
        '200':
          description: Saved thresholds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimits'
        '400':
          description: Missing or out-of-range settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /healthz:
    get:
      servers:
        - url: /
      tags: [Health]
      operationId: getHealth
      summary: Read aggregate service health
      description: |
        Unauthenticated infrastructure health check. Returns database reachability, configured
        and alive worker counts, and queue depth only; it does not expose user or host details.
        A GET route also accepts HEAD through Go's net/http ServeMux.
      security: []
      responses:
        '200':
          description: Database is reachable and all configured workers are alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: Database is unreachable or fewer workers are alive than configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /ws/v1/submissions/{id}:
    get:
      servers:
        - url: /
      tags: [WebSocket]
      operationId: streamSubmissionProgress
      summary: Open the submission progress WebSocket
      description: |
        This GET upgrades to WebSocket; it is not an ordinary JSON API response. First obtain a
        one-time ticket by calling `POST /api/v1/ws-tickets` with a Bearer access token and the
        submission ID. Connect to `/ws/v1/submissions/{id}?ticket={ticket}`; the ticket is consumed
        whether or not the handshake succeeds and must match the path submission ID. The browser
        sends no Authorization header or application data. The server sends JSON frames with
        `status`, `current_test`, and `total_tests`, beginning with the latest full state. It closes
        with code 1000 after `COMPLETED`, `FAILED`, or `CANCELLED`,         or 1001 during server shutdown. Each frame conforms to the `WebSocketProgress` schema.
      security: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - name: ticket
          in: query
          required: true
          description: Single-use ticket returned by POST /api/v1/ws-tickets.
          schema:
            type: string
      responses:
        '101':
          description: WebSocket connection upgraded; subsequent JSON messages follow the stream description.
        '400':
          description: Request is not a WebSocket upgrade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ticket is invalid, expired, or already consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Submission ID is invalid or does not match the ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The server could not read the submission's current progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number; defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Items per page; defaults to 50 and may not exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SubmissionId:
      name: id
      in: path
      required: true
      description: Positive submission ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    CourseId:
      name: id
      in: path
      required: true
      description: Positive Course ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminUserId:
      name: id
      in: path
      required: true
      description: Positive user ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    EnrollmentUserId:
      name: user_id
      in: path
      required: true
      description: Positive student user ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    AssignmentId:
      name: id
      in: path
      required: true
      description: Positive assignment ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    TestCaseId:
      name: id
      in: path
      required: true
      description: Positive test-case ID.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Unauthorized:
      description: Missing or invalid Bearer access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request body, parameter, or pagination value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated user does not have the required role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [STUDENT, LECTURER, ADMIN]
    UserPage:
      type: object
      required: [items, page, page_size, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        page_size:
          type: integer
        has_next:
          type: boolean
    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    Course:
      type: object
      required: [id, name, code, term, lecturer_id]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
        term:
          type: string
        lecturer_id:
          type: integer
          format: int64
    CoursePage:
      type: object
      required: [items, page, page_size, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        page:
          type: integer
        page_size:
