    AssignmentCreateRequest:
      type: object
      additionalProperties: false
      required: [title, deadline_at, late_until_at, resource_limit]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        deadline_at:
          type: string
          format: date-time
        late_until_at:
          type: string
          format: date-time
          description: Must be equal to or later than deadline_at.
        resource_limit:
          $ref: '#/components/schemas/ResourceLimitRequest'
    AssignmentUpdateRequest:
      type: object
      additionalProperties: false
      required: [title, deadline_at, late_until_at]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        deadline_at:
          type: string
          format: date-time
        late_until_at:
          type: string
          format: date-time
          description: Must be equal to or later than deadline_at.
        resource_limit:
          $ref: '#/components/schemas/ResourceLimitIgnored'
          description: Accepted by the decoder but not applied by this operation; update limits separately.
    ResourceLimit:
      type: object
      required: [assignment_id, cpu_time_ms, memory_mb, max_processes, timeout_s, max_output_bytes, tmpfs_size_mb]
      properties:
        assignment_id:
          type: integer
          format: int64
        cpu_time_ms:
          type: integer
        memory_mb:
          type: integer
        max_processes:
          type: integer
        timeout_s:
          type: integer
        max_output_bytes:
          type: integer
        tmpfs_size_mb:
          type: integer
    ResourceLimitRequest:
      type: object
      additionalProperties: false
      required: [cpu_time_ms, memory_mb, max_processes, timeout_s, max_output_bytes, tmpfs_size_mb]
      properties:
        cpu_time_ms:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        max_processes:
          type: integer
          minimum: 1
        timeout_s:
          type: integer
          minimum: 1
        max_output_bytes:
          type: integer
          minimum: 1
        tmpfs_size_mb:
          type: integer
          minimum: 1
      description: |
        Every value must be a positive integer. The handler also enforces
        `tmpfs_size_mb + 16 <= memory_mb` and `2 * max_output_bytes < tmpfs_size_mb * 2^20`.
    ResourceLimitIgnored:
      type: object
      additionalProperties: false
      properties:
        cpu_time_ms:
          type: integer
        memory_mb:
          type: integer
        max_processes:
          type: integer
        timeout_s:
          type: integer
        max_output_bytes:
          type: integer
        tmpfs_size_mb:
          type: integer
      description: Optional accepted object on assignment updates; its fields are not applied.
