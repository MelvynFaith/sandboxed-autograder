      type: object
      required: [status, database, workers, queue_depth]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        database:
          type: string
          enum: [ok, unreachable]
        workers:
          $ref: '#/components/schemas/WorkerCount'
        queue_depth:
          type: integer
